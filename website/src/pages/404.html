<!doctype html>
<html lang="{{v:lang}}">
<head>
{{> head}}
<meta name="robots" content="noindex">
</head>
<body class="page page-404">
{{> sprite}}
{{> header}}
<main id="main" class="not-found">
  <canvas class="haze-canvas" data-haze="hero" aria-hidden="true"></canvas>
  <div class="wrap not-found-inner">
    <p class="kicker">404</p>
    <h1 class="display">{{t:notFound.title}}</h1>
    <p class="lede">{{t:notFound.text}}</p>
    <p><a class="btn btn-primary" href="{{v:homeHref}}">{{t:notFound.home}}<svg class="icon"><use href="#i-arrow"/></svg></a></p>
    <p class="muted" lang="{{v:otherLang}}">{{v:otherNotFound}} <a href="{{v:otherHomeHref}}">{{v:otherHomeLabel}}</a></p>
  </div>
</main>
{{> footer}}
<script type="module" src="{{v:root}}assets/js/site.js?v={{v:jsVersion}}"></script>
</body>
</html>
