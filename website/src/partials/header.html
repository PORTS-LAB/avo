<a class="skip-link" href="#main">{{t:common.skip}}</a>
<header class="site-header" data-header>
  <div class="wrap header-inner">
    <a class="brand" href="{{v:homeHref}}">
      <img src="{{v:root}}assets/img/avo-mark.svg" alt="" width="30" height="30">
      <span class="brand-name">Avo</span>
      <span class="visually-hidden">{{t:common.homeLink}}</span>
    </a>
    <nav class="site-nav" id="site-nav" aria-label="{{a:nav.label}}" data-nav>
      <ul>
{{h:navItems}}
      </ul>
    </nav>
    <div class="header-actions">
      <a class="lang-switch" href="{{v:langHref}}" hreflang="{{v:otherLang}}" lang="{{v:otherLang}}" data-lang-switch>
        <span class="visually-hidden">{{t:common.langLabel}}: </span><span class="lang-long">{{t:common.langOther}}</span><span class="lang-short" aria-hidden="true">{{t:common.langOtherShort}}</span>
      </a>
      <a class="btn btn-quiet btn-small header-github" href="{{v:githubUrl}}">
        <svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>{{t:common.github}}</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle data-close-label="{{a:common.closeMenu}}" hidden>
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden" data-label-open>{{t:common.menu}}</span>
      </button>
    </div>
  </div>
</header>
