name: Feature request
description: An idea for Avo.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with
      description: The situation or problem, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
